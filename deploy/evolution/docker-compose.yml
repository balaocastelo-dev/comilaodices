# Evolution API (WhatsApp via QR code) para o Coolify
# Coolify → Project → + New → Docker Compose (Empty) → cole este arquivo.
# Defina as variáveis marcadas com ${...} em "Environment Variables" do Coolify.
# Domínio sugerido: https://wa.komilaodoces.com.br  (Coolify gera o SSL)
#
# IMPORTANTE: a Evolution fica pública só para o app e o webhook; a segurança é a AUTHENTICATION_API_KEY.
# Gere com: openssl rand -hex 32   — e NUNCA coloque no frontend.

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7   # versão estável (a "latest" aponta para release candidate)
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    environment:
      - SERVICE_FQDN_EVOLUTION_8080            # o Coolify associa o domínio configurado
      - SERVER_URL=${EVOLUTION_SERVER_URL}     # ex.: https://wa.komilaodoces.com.br
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false
      - LANGUAGE=pt-BR
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE_CLIENT=Doces Komilao
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_komilao
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false            # o webhook é configurado por instância pelo painel Komilão
      - LOG_LEVEL=ERROR,WARN,INFO
    volumes:
      - evolution-instances:/evolution/instances
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - evolution-pg:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution-redis:/data

volumes:
  evolution-instances:
  evolution-pg:
  evolution-redis:
